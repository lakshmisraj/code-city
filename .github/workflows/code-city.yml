# Code City's own PRs get the summary from the published action.
name: Code City PR summary
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # pinned to an exact commit (v1 as of 2026-10-30, eb00ee3), since the job can write PR comments; bump it on purpose
      - uses: lakshmisraj/code-city-pr-summary@ab003564d21091d187a5fff887a37e551960d9bb # v1.0.1
