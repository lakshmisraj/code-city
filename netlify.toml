[build]
  publish = "site"
  # Code City is three Netlify sites from this one repo: Beginner (this address), Advanced and Manager. Each
  # builds the page as its own version from two settings made per site in Netlify: CODECITY_FOR (beginner,
  # the default, advanced or manager) and CODECITY_SITES, the other two's addresses for the Guide's links.
  command = "python3 codecity.py build --for \"${CODECITY_FOR:-beginner}\" --sites \"${CODECITY_SITES:-}\""
  # A push that changes nothing the sites are made from (only tests, docs, the VS Code extension or CI)
  # skips the build on all three. Exit 0 skips. A first build, a redeploy of the same commit (to pick up
  # changed settings) or a commit git can't find all build.
  ignore = "test -n \"$CACHED_COMMIT_REF\" && test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- src site netlify netlify.toml codecity.py package.json package-lock.json"

# The old netlify.app addresses send visitors to codecitydev.com, keeping the path and query. Each rule
# matches only its exact host, so deploy previews (deploy-preview-N--code-city-view.netlify.app) still work.
[[redirects]]
  from = "https://code-city-view.netlify.app/*"
  to = "https://codecitydev.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://code-city-advanced.netlify.app/*"
  to = "https://advanced.codecitydev.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://code-city-manager.netlify.app/*"
  to = "https://manager.codecitydev.com/:splat"
  status = 301
  force = true

[functions]
  directory = "netlify/functions"

# The page's scripts come only from itself and the two CDNs it names (each pinned with an integrity hash),
# and it only talks to GitHub and its own functions. 'wasm-unsafe-eval' lets it compile WebAssembly (the
# tree-sitter parser in vendor/, served from this site) without allowing eval.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
